services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      FACEID_DATA_DIR: /app/data
      FACEID_STORAGE_DIR: /app/storage
      FACEID_MODEL_PROVIDER: ${FACEID_MODEL_PROVIDER:-mock}
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
